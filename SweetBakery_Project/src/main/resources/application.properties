spring.application.name=SweetBakery
server.port=${PORT:8080}

# H2 database for easy local setup. On hosting, environment variables can override these values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sweetbakery;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
