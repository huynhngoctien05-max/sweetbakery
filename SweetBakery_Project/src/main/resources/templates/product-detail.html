<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết bánh | SweetBakery</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}"><span class="brand-icon">✿</span><span>Sweet<span class="brand-pink">Bakery</span><small>BÁNH NGỌT TỪ TRÁI TIM</small></span></a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/gio-hang}">Giỏ hàng</a></nav><div class="header-actions"><a th:href="@{/dang-nhap}" th:if="${session.khachHangId == null}" class="text-link">Đăng nhập</a><a th:href="@{/dang-xuat}" th:if="${session.khachHangId != null}" class="text-link">Đăng xuất</a></div></header><main class="detail-wrap"><div class="breadcrumbs"><a th:href="@{/}">Trang chủ</a> / Chi tiết sản phẩm</div><section class="detail-grid"><div class="detail-image"><img th:src="${sanPham.anh}" th:alt="${sanPham.ten}"></div><div class="detail-info"><span class="eyebrow" th:text="${sanPham.danhMuc}">Bánh kem</span><h1 th:text="${sanPham.ten}">Tên bánh</h1><div class="detail-price" th:text="|${#numbers.formatDecimal(sanPham.gia,0,'COMMA',0,'POINT')} ₫|">389.000 ₫</div><p th:text="${sanPham.moTa}">Mô tả bánh</p><div class="detail-benefits"><span>♡ Bánh làm mới mỗi ngày</span><span>✿ Đóng gói cẩn thận</span><span>♧ Có hỗ trợ giao hàng</span></div><form th:action="@{/gio-hang/them/{id}(id=${sanPham.id})}" method="post" class="buy-form"><label for="soLuong">Số lượng</label><input id="soLuong" name="soLuong" type="number" min="1" max="20" value="1"><button class="button" type="submit">Thêm vào giỏ hàng →</button></form><a class="back-link" th:href="@{/}">← Tiếp tục chọn bánh</a></div></section></main><footer class="site-footer"><p>SweetBakery · Ngọt ngào trong từng khoảnh khắc.</p></footer></body></html>
