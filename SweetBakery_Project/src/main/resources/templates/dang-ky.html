<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký | SweetBakery</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-body"><header class="site-header"><a class="brand" th:href="@{/}"><span class="brand-icon">✿</span><span>Sweet<span class="brand-pink">Bakery</span><small>BÁNH NGỌT TỪ TRÁI TIM</small></span></a><a class="text-link" th:href="@{/}">← Về trang chủ</a></header><main class="auth-wrap"><div class="auth-decoration">✿</div><section class="auth-card"><span class="eyebrow">THAM GIA GIA ĐÌNH SWEETBAKERY</span><h1>Tạo tài khoản <em>mới</em></h1><p>Để những lần đặt bánh sau trở nên thật dễ dàng.</p><div th:if="${loi}" class="alert alert-error" th:text="${loi}"></div><form method="post" th:action="@{/dang-ky}" class="form-stack"><label>Họ và tên<input name="hoTen" required minlength="2" maxlength="100" placeholder="Nguyễn An"></label><label>Email<input name="email" type="email" required maxlength="160" placeholder="ban@email.com"></label><label>Số điện thoại<input name="soDienThoai" type="tel" required minlength="9" maxlength="20" placeholder="09xxxxxxxx"></label><label>Mật khẩu<input name="matKhau" type="password" required minlength="8" placeholder="Ít nhất 8 ký tự"></label><label>Nhập lại mật khẩu<input name="xacNhanMatKhau" type="password" required minlength="8" placeholder="Nhập lại mật khẩu"></label><button class="button button-full" type="submit">Tạo tài khoản →</button></form><div class="auth-bottom">Đã có tài khoản? <a th:href="@{/dang-nhap}">Đăng nhập</a></div></section></main><footer class="site-footer"><small>© 2026 SweetBakery</small></footer></body></html>
