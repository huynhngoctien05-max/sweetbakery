<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thanh toán | SweetBakery</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}"><span class="brand-icon">✿</span><span>Sweet<span class="brand-pink">Bakery</span><small>BÁNH NGỌT TỪ TRÁI TIM</small></span></a><a class="text-link" th:href="@{/gio-hang}">← Quay lại giỏ hàng</a></header><main class="page-wrap narrow"><div class="page-heading"><span class="eyebrow">CHỈ CÒN MỘT BƯỚC NỮA</span><h1>Thông tin <em>giao bánh</em></h1><p>Xin chào <b th:text="${session.khachHangTen}">bạn</b>, hãy nhập địa chỉ nhận hàng.</p></div><div th:if="${loi}" class="alert alert-error" th:text="${loi}"></div><div class="checkout-card"><form method="post" th:action="@{/thanh-toan}" class="form-stack"><label>Địa chỉ giao hàng<textarea name="diaChi" required minlength="8" maxlength="250" rows="3" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea></label><div class="summary-line"><span>Số loại bánh</span><b th:text="${#lists.size(items)}">0</b></div><div class="summary-total"><span>Tổng đơn hàng</span><strong th:text="|${#numbers.formatDecimal(tongTien,0,'COMMA',0,'POINT')} ₫|">0 ₫</strong></div><button class="button button-full" type="submit">Xác nhận đặt hàng →</button></form><p class="small-note">Đây là bản demo học tập, chưa tích hợp thanh toán trực tuyến.</p></div></main><footer class="site-footer"><small>© 2026 SweetBakery</small></footer></body></html>
