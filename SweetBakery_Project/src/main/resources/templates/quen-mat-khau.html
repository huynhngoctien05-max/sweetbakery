<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quên mật khẩu | SweetBakery</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-body"><header class="site-header"><a class="brand" th:href="@{/}"><span class="brand-icon">✿</span><span>Sweet<span class="brand-pink">Bakery</span><small>BÁNH NGỌT TỪ TRÁI TIM</small></span></a><a class="text-link" th:href="@{/dang-nhap}">← Đăng nhập</a></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">KHÔNG SAO, MÌNH GIÚP BẠN</span><h1>Đặt lại <em>mật khẩu</em></h1><p>Nhập email và số điện thoại đã đăng ký, sau đó tạo mật khẩu mới.</p><div class="alert alert-note">Bản bài tập này xác minh bằng email và số điện thoại, chưa gửi mã OTP qua email/SMS.</div><div th:if="${loi}" class="alert alert-error" th:text="${loi}"></div><form method="post" th:action="@{/quen-mat-khau}" class="form-stack"><label>Email<input name="email" type="email" required placeholder="ban@email.com"></label><label>Số điện thoại<input name="soDienThoai" type="tel" required placeholder="Số đã đăng ký"></label><label>Mật khẩu mới<input name="matKhauMoi" type="password" required minlength="8" placeholder="Ít nhất 8 ký tự"></label><button class="button button-full" type="submit">Cập nhật mật khẩu →</button></form></section></main><footer class="site-footer"><small>© 2026 SweetBakery</small></footer></body></html>
